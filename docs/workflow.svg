    </marker>
  </defs>
  <rect width="1100" height="260" fill="#fff"/>
  <g fill="none" stroke="#111" stroke-width="2">
    <rect x="22" y="40" width="234" height="90" rx="5"/>
    <rect x="296" y="40" width="234" height="90" rx="5"/>
    <rect x="570" y="40" width="234" height="90" rx="5"/>
    <rect x="844" y="40" width="234" height="90" rx="5"/>
    <path d="M262 85h27" marker-end="url(#arrow)"/>
    <path d="M536 85h27" marker-end="url(#arrow)"/>
    <path d="M810 85h27" marker-end="url(#arrow)"/>
    <path d="M961 136v63H413v-62" marker-end="url(#arrow)"/>
